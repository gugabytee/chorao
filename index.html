<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Surpresa!</title>
  <style>
    body {
      background: #000;
      color: #39ff14;
      text-align: center;
      font-family: 'Courier New', monospace;
      padding-top: 50px;
    }
    h1 {
      font-size: 2.5em;
      animation: piscar 1s infinite;
    }
    @keyframes piscar {
      50% { opacity: 0.3; }
    }
    img {
      max-width: 400px;
      margin-top: 20px;
      border: 3px solid #39ff14;
      border-radius: 10px;
    }
    #ip { font-weight: bold; color: #fff; }
    .frase {
      margin-top: 20px;
      font-size: 1.2em;
      color: #ff4444;
    }
  </style>
</head>
<body>
  <h1>👀 Peguei você chorando!</h1>
  <p>Seu IP é: <span id="ip">carregando...</span></p>
  <p>Cidade aproximada: <span id="cidade">carregando...</span></p>
  <p class="frase" id="frase"></p>

  <audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <img src="animacao.gif" alt="Animação divertida">

  <script>
    const frases = [
      "relaxa, era só um smoke mal jogado",
      "o rank não define seu valor... define só um pouco",
      "avisa a rota que era friendly fire",
      "5 anos de premier pra isso?",
      "posiciona o mouse e sai andando"
    ];
    document.getElementById("frase").textContent =
      frases[Math.floor(Math.random() * frases.length)];

    fetch("https://ipapi.co/json/")
      .then(res => res.json())
      .then(data => {
        document.getElementById("ip").textContent = data.ip;
        document.getElementById("cidade").textContent = data.city + ", " + data.region;
      })
      .catch(() => {
        document.getElementById("ip").textContent = "não detectado";
      });
  </script>
</body>
</html>
