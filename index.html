<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>.exe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #000;
    color: #39ff14;
    font-family: 'Courier New', monospace;
    overflow-x: hidden;
    min-height: 100%;
  }

  #bgvideo {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #bgvideo.ativo {
    opacity: 1;
  }

  .tela-central {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  #gate h2, #boot div {
    text-shadow:
      0 0 4px #000,
      0 0 8px #000,
      0 0 14px #000,
      0 0 2px #39ff14;
  }

  .janela-terminal {
    display: block;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    background: rgba(0, 10, 0, 0.72);
    border: 1px solid #39ff14;
    border-radius: 6px;
    box-shadow: 0 0 18px rgba(57,255,20,0.4);
    text-align: left;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp .8s ease forwards;
  }
  .janela-terminal .barra {
    background: rgba(57,255,20,0.15);
    border-bottom: 1px solid #39ff14;
    padding: 4px 8px;
    font-size: 0.65em;
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .janela-terminal .bolinha {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #39ff14;
    opacity: 0.6;
  }
  .janela-terminal .corpo {
    padding: 10px 12px;
    font-size: 0.85em;
    line-height: 1.5;
  }

  h1 {
    font-size: 1em;
    font-weight: normal;
    margin: 0;
  }

  .frase {
    font-style: italic;
    margin-top: 10px;
  }

  #mensagem {
    margin-top: 6px;
  }

  #rodape {
    margin-top: 14px;
    line-height: 1.5;
  }

  #linha-contador {
    margin-top: 18px;
    text-align: center;
  }

  #linha-contador p {
    margin-bottom: 8px;
  }

  #btnSom {
    margin-top: 12px;
    background: transparent;
    color: #39ff14;
    border: 1px solid #39ff14;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    display: none;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  a {
    color: #39ff14;
    text-decoration: none;
    font-weight: bold;
    border-bottom: 1px dashed #39ff14;
  }
  a:hover { color: #fff; border-bottom-color: #fff; }

  #gate {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }

  #boot {
    font-size: 1em;
    min-height: 90px;
    margin-bottom: 20px;
    white-space: pre-line;
    max-width: 520px;
  }

  #btnEntrar {
    background: #39ff14;
    color: #000;
    border: none;
    padding: 15px 30px;
    font-size: 1.3em;
    font-weight: bold;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    box-shadow: 0 0 15px #39ff14;
    display: none;
    animation: pulse 1.4s ease-in-out infinite;
  }
  #btnEntrar:hover {
    background: #2ecc0f;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 10px #39ff14; }
    50% { box-shadow: 0 0 25px #39ff14; }
  }

  #conteudo {
    display: none;
  }
</style>
</head>
<body>

  <video id="bgvideo" muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>

  <div id="gate">
    <div id="boot"></div>
    <button id="btnEntrar">ENTRAR</button>
  </div>

  <div id="conteudo">
    <div class="tela-central">
      <div class="janela-terminal">
        <div class="barra">
          <span class="bolinha"></span>
          <span>terminal.exe</span>
        </div>
        <div class="corpo">
          <h1>Peguei você chorando!</h1>
          <p id="mensagem">localizando...</p>
          <p class="frase" id="frase"></p>
          <p id="rodape">
            clicou, então já era.
            <a href="https://twitch.tv/mdsguh" >twitch.tv/mdsguh</a>
            pra chorar ao vivo, e um comentário na Steam pra registrar o momento
          </p>

          <div id="linha-contador">
            <p>número de curiosos registrados até agora:</p>
            <div align="center">
              <a href="">
                <img src="https://contador.s12.com.br/img-Awwa33Zd12cDcw10-9.gif" border="0" alt="">
              </a>
              <script type="text/javascript" src="https://contador.s12.com.br/ad.js?id=8ZC960yCC8b8W5Z3"></script>
            </div>
            <button id="btnSom">🔊 tocar música</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="musica" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <script>
    const linhasBoot = [
      "> escaneando nível de tilt...",
      "> tudo pronto. clique se tiver coragem."
    ];
    const bootEl = document.getElementById('boot');
    const btnEntrar = document.getElementById('btnEntrar');

    function digitar(linhas, i, cb) {
      if (i >= linhas.length) { cb(); return; }
      let texto = linhas[i];
      let j = 0;
      const linha = document.createElement('div');
      bootEl.appendChild(linha);
      const intervalo = setInterval(() => {
        linha.textContent = texto.slice(0, j) + "▌";
        j++;
        if (j > texto.length) {
          clearInterval(intervalo);
          linha.textContent = texto;
          setTimeout(() => digitar(linhas, i + 1, cb), 90);
        }
      }, 8);
    }
    digitar(linhasBoot, 0, () => {
      btnEntrar.style.display = "inline-block";
    });

    const frases = [
      "curiosidade nível clickbait de golpe",
      "clicou mais rápido que reage a um flash",
      "5 anos de premier e essa foi sua call certa",
      "posiciona o mouse e sai andando",
      "10 anos de mirage...",
      "ping ótimo, decisões nem tanto",
      "flashou o próprio time com estilo",
      "chorou tanto que baixou o FPS",
      "vai ligar o monitor quando?",
      "mira ótima... pro próprio pé"
    ];

    const audio = document.getElementById("musica");
    const btnSom = document.getElementById("btnSom");

    btnEntrar.addEventListener("click", () => {
      document.getElementById("gate").style.display = "none";
      document.getElementById("conteudo").style.display = "block";

      const video = document.getElementById("bgvideo");
      video.classList.add("ativo");
      video.play().catch(() => {});

      const tocarPromise = audio.play();
      if (tocarPromise !== undefined) {
        tocarPromise.catch(() => {
          btnSom.style.display = "inline-block";
        });
      }

      tentarGeo();

      document.getElementById("frase").textContent =
        frases[Math.floor(Math.random() * frases.length)];
    });

    btnSom.addEventListener("click", () => {
      audio.play();
      btnSom.style.display = "none";
    });

    function comTimeout(promessa, ms) {
      return Promise.race([
        promessa,
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
      ]);
    }

    function tentarGeo() {
      comTimeout(fetch("https://ipapi.co/json/").then(r => r.json()), 4000)
        .then(data => {
          document.getElementById("mensagem").textContent =
            `localizado perto de ${data.city}`;
        })
        .catch(() => {
          comTimeout(fetch("https://ipwho.is/").then(r => r.json()), 4000)
            .then(data => {
              document.getElementById("mensagem").textContent =
                `localizado perto de ${data.city}`;
            })
            .catch(() => {
              document.getElementById("mensagem").textContent =
                "não te achamos, mas te pegamos mesmo assim";
            });
        });
    }
  </script>
</body>
</html>
