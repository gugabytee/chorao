<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: pointer;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  img {
    max-width: 100%;
    max-height: 100%;
    display: block;
  }

  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-family: sans-serif;
    font-size: 14px;
    background: #000;
    z-index: 2;
  }

  #overlay.hidden {
    display: none;
  }
</style>
</head>
<body>

  <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExYmFjYTY5YTVvenNpZ2pzZDRwc3hiNDl4Z3dzejYwYjRrYXczYml6cCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ar71Hyi0ZKejXzMoNs/giphy.gif" alt="Batman sentado na chuva">

  <audio id="musica" src="musica.mp3" loop></audio>

  <div id="overlay">clique para tocar 🔊</div>

  <script>
    const audio = document.getElementById('musica');
    const overlay = document.getElementById('overlay');

    // Tenta autoplay direto (funciona em alguns navegadores/contextos)
    audio.play().then(() => {
      overlay.classList.add('hidden');
    }).catch(() => {
      // Bloqueado: precisa de interação do usuário
    });

    // Ao primeiro clique em qualquer lugar da página, garante que toque
    document.body.addEventListener('click', () => {
      audio.play();
      overlay.classList.add('hidden');
    }, { once: true });
  </script>

</body>
</html>
